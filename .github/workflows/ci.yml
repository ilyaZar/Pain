name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - uses: astral-sh/setup-uv@v5

      - name: Install tools
        # uv.lock pins ty while its diagnostics are still stabilizing.
        run: uv sync --locked --group dev

      - name: Ruff check
        run: uv run ruff check Pain.py tests/ tests_sublime/

      - name: Ruff format
        run: uv run ruff format --check Pain.py tests/ tests_sublime/

      - name: ty
        run: uv run ty check Pain.py

      - name: Tests with coverage
        run: uv run pytest tests/ -v --cov=Pain --cov-report=xml

      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml

  sublime-runtime-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: SublimeText/UnitTesting/actions/setup@v1
        with:
          package-name: Pain
          sublime-text-version: 4

      - uses: SublimeText/UnitTesting/actions/run-tests@v1
        with:
          package-name: Pain
